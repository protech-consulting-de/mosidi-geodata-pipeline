name: Pipeline tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgis/postgis:17-3.7@sha256:ca211960fbe54834dcb6ff16aae6d70f72f66f4a789820aed3d5691025c9d698
        env:
          POSTGRES_DB: mosidi_demo
          POSTGRES_USER: pipeline_demo
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pipeline_demo -d mosidi_demo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://pipeline_demo:ci-only-password@localhost:5432/mosidi_demo
      TEST_DATABASE_URL: postgresql://pipeline_demo:ci-only-password@localhost:5432/mosidi_demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install application and test dependencies
        run: |
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-deps .
      - name: Initialize isolated demonstration schema
        run: python -m geopipeline --config config/demo.yaml init-demo
      - name: Run unit and PostGIS integration tests
        run: python -m pytest -q
      - name: Build and smoke-test the container
        run: |
          docker build --tag mosidi-pipeline:ci .
          docker run --rm mosidi-pipeline:ci --help
