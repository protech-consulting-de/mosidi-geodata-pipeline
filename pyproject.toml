[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mosidi-geodata-pipeline"
version = "0.1.0"
description = "Reproducible WFS and statistical CSV imports into PostgreSQL/PostGIS"
requires-python = ">=3.12"
dependencies = [
  "requests>=2.32,<3", "psycopg[binary]>=3.2,<4", "PyYAML>=6,<7",
  "shapely>=2.0,<3", "pyproj>=3.7,<4", "defusedxml>=0.7,<1",
  "inflate64>=1.0.4,<2", "openpyxl>=3.1,<4"
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
geopipeline = "geopipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
geopipeline = ["sql/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a disposable PostGIS database"]

